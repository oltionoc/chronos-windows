server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SECURITY: block the internal worker->api ingestion API from being
    # reachable through the public-facing frontend port. BLUEPRINT.md Section
    # 2.4/4.10 states these endpoints are "worker -> api only, not reachable
    # from frontend" and are protected only by a shared secret
    # (X-Internal-Key), not network segmentation — without this block, the
    # blanket /api/ proxy below would still forward them, making the shared
    # secret the *only* defense instead of defense-in-depth. Must come before
    # the generic /api/ location. See SECURITY_REPORT.md.
    location /api/v1/internal/ {
        return 404;
    }

    # Reverse-proxy /api to the `api` service (BLUEPRINT.md Section 2.4/8) —
    # keeps the frontend's default VITE_API_BASE_URL (/api/v1) working
    # unmodified and same-origin (so the httpOnly session cookie from
    # POST /auth/login is sent on every subsequent request without CORS).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
