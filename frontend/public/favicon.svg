<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Matches the installer icon (packaging/windows/chronos.ico): the Chronos
       mark on a white rounded tile so it reads as the app icon on any browser
       tab, light or dark, instead of a bare dark shape on transparent. -->
  <rect width="100" height="100" rx="22" fill="#FFFFFF"/>
  <g transform="translate(11 11) scale(0.78)">
    <path fill-rule="evenodd" clip-rule="evenodd"
      d="M100 0 H0 V100 H100 V64 H50 V36 H100 Z M50 28 A22 22 0 1 1 49.99 28 Z"
      fill="#232326"/>
  </g>
</svg>
