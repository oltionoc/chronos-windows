# Builds ChronosSetup.exe on a clean Windows machine, then installs it there
# and checks it actually works, then uninstalls it — so every installer that
# comes out of this has been through a real install at least once.
#
# Nuitka cannot cross-compile, so Windows is the only place the Windows
# executables can be built. Run it from the Actions tab (Run workflow), or
# push a tag like v0.1.0.

name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the installer"
        default: "0.1.0-beta"
  push:
    tags: ["v*"]

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Version
        id: version
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          if (-not $v) { $v = "0.1.0-beta" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        run: ./packaging/windows/build.ps1 -Version "${{ steps.version.outputs.value }}"

      # ---------------------------------------------------------------------
      # Install it for real on this machine and check it works end to end.
      # ---------------------------------------------------------------------
      - name: Install
        run: |
          $setup = "packaging/windows/Output/ChronosSetup-${{ steps.version.outputs.value }}.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=installer.log' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          Get-Content "$env:ProgramData\Chronos\logs\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 40

      - name: Smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($svc in 'ChronosPostgres', 'ChronosServer', 'ChronosWorker') {
            $s = Get-Service $svc
            "$svc : $($s.Status)"
            if ($s.Status -ne 'Running') { throw "$svc is not running" }
          }

          $base = 'http://127.0.0.1:8080'
          if ((Invoke-WebRequest -UseBasicParsing "$base/health").StatusCode -ne 200) { throw 'health failed' }

          $home_ = Invoke-WebRequest -UseBasicParsing "$base/"
          if ($home_.Content -notmatch '<title>Chronos</title>') { throw 'web UI not served at /' }
          if ((Invoke-WebRequest -UseBasicParsing "$base/employees/12").Content -notmatch '<title>Chronos</title>') { throw 'deep link did not fall back to the app' }
          if ((Invoke-WebRequest -UseBasicParsing "$base/manuali.html").StatusCode -ne 200) { throw 'manual not served' }

          # Bootstrap admin can sign in (migrations ran, database reachable).
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $login = Invoke-WebRequest -UseBasicParsing -WebSession $session -Method Post -Uri "$base/api/v1/auth/login" `
            -ContentType 'application/json' -Body '{"username":"admin","password":"ChangeMe123!"}'
          if ($login.StatusCode -ne 204) { throw "login returned $($login.StatusCode)" }
          $me = Invoke-RestMethod -WebSession $session "$base/api/v1/auth/me"
          if ($me.username -ne 'admin') { throw 'auth/me did not return the admin' }

          # Internal endpoints: loopback answers, the network gets 404.
          $key = (Get-Content "$env:ProgramData\Chronos\chronos.env" | Where-Object { $_ -like 'INTERNAL_API_KEY=*' }).Split('=', 2)[1]
          $local = Invoke-WebRequest -UseBasicParsing -Headers @{ 'X-Internal-Key' = $key } "$base/api/v1/internal/devices"
          if ($local.StatusCode -ne 200) { throw 'internal endpoint refused a loopback caller' }
          $lan = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.PrefixOrigin -ne 'WellKnown' } | Select-Object -First 1).IPAddress
          "LAN address: $lan"
          # -SkipHttpErrorCheck returns the status instead of throwing, so a
          # try/catch cannot swallow the failure this check exists to catch.
          $net = Invoke-WebRequest -UseBasicParsing -SkipHttpErrorCheck -Headers @{ 'X-Internal-Key' = $key } "http://${lan}:8080/api/v1/internal/devices"
          if ($net.StatusCode -ne 404) { throw "internal endpoint answered a network caller with $($net.StatusCode)" }

          # Worker listens on loopback only.
          $listen = Get-NetTCPConnection -LocalPort 8100 -State Listen
          if ($listen.LocalAddress -ne '127.0.0.1') { throw "worker listening on $($listen.LocalAddress)" }

          # Backup ran during install and verified.
          $marker = Get-Content "$env:ProgramData\Chronos\backups\LAST_BACKUP"
          "backup marker: $marker"
          if ($marker -notmatch '^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ ok chronos-') { throw 'no verified backup' }

          # Only the migrations ship as readable Python.
          $py = Get-ChildItem -Recurse "$env:ProgramFiles\Chronos" -Include *.py | Where-Object { $_.FullName -notmatch '\\alembic\\' }
          if ($py) { throw "readable Python shipped: $($py.FullName -join ', ')" }
          'smoke test passed'

      - name: Upgrade in place
        run: |
          # Same installer again over the running install: services must come
          # back and the existing database and secrets must survive.
          $before = (Get-FileHash "$env:ProgramData\Chronos\chronos.env").Hash
          $setup = "packaging/windows/Output/ChronosSetup-${{ steps.version.outputs.value }}.exe"
          Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          if ((Get-FileHash "$env:ProgramData\Chronos\chronos.env").Hash -ne $before) { throw 'upgrade rewrote the config and its secrets' }
          if ((Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8080/health').StatusCode -ne 200) { throw 'not healthy after upgrade' }
          'upgrade kept config and came back healthy'

      - name: Uninstall
        run: |
          $uninstaller = Get-ChildItem "$env:ProgramFiles\Chronos\unins*.exe" | Select-Object -First 1
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          if (Get-Service ChronosServer -ErrorAction SilentlyContinue) { throw 'ChronosServer survived uninstall' }
          if (-not (Test-Path "$env:ProgramData\Chronos\pgdata")) { throw 'uninstall deleted the data it must keep' }
          'uninstall removed services and kept the data'

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            installer.log
            C:\ProgramData\Chronos\logs\
          if-no-files-found: ignore

      - name: Installer
        uses: actions/upload-artifact@v4
        with:
          name: ChronosSetup-${{ steps.version.outputs.value }}
          path: packaging/windows/Output/*.exe
